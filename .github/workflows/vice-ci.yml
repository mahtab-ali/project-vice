name: Vice CI

# Builds the fork on all three desktop platforms by reusing upstream's
# per-platform workflows, so their build steps stay in one place.
# Started by hand: three full builds are too costly to run on every push.
#   gh workflow run vice-ci.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/build-macos-arm.yml
  windows:
    uses: ./.github/workflows/build-windows-x86.yml
  linux:
    uses: ./.github/workflows/build-appimage-x64.yml
